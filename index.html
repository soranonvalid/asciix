<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="Convert images into configurable ASCII prints and export them as PNG, WebP, or JPEG.">
  <title>asciix — Shader Lab</title>
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-github" viewBox="0 0 16 16">
      <path fill="currentColor" d="M8 0a8 8 0 0 0-2.53 15.59c.4.08.55-.17.55-.38v-1.49c-2.23.48-2.7-.95-2.7-.95-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.22.82 1.22.82.72 1.22 1.88.87 2.34.66.07-.52.28-.87.51-1.07-1.78-.2-3.65-.89-3.65-3.96 0-.88.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.13 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.11.16 1.93.08 2.13.51.56.82 1.27.82 2.15 0 3.08-1.87 3.75-3.66 3.95.29.25.55.73.55 1.48v2.22c0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/>
    </symbol>
    <symbol id="icon-open" viewBox="0 0 24 24">
      <path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10Zm0 0v7h7M12 17v-5m-3 3 3-3 3 3"/>
    </symbol>
    <symbol id="icon-export" viewBox="0 0 24 24">
      <path d="M6 18 18 6M8 6h10v10"/>
    </symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="1"/>
      <path d="m7 9 3 3-3 3m6 0h4"/>
    </symbol>
    <symbol id="icon-image" viewBox="0 0 24 24">
      <rect x="4" y="4" width="16" height="16" rx="1"/>
      <path d="m6 16 4-4 3 3 2-2 3 3m-3-7h.01"/>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <rect x="8" y="3" width="12" height="15" rx="1"/>
      <path d="M16 22H5a1 1 0 0 1-1-1V8"/>
    </symbol>
    <symbol id="icon-reset" viewBox="0 0 24 24">
      <path d="M4 10a8 8 0 1 1 0 5m0-5V4m0 6h6"/>
    </symbol>
  </svg>

  <header class="masthead">
    <div class="brand-row">
      <div class="brand">
        <h1>asciix</h1>
        <a class="shader-download" href="%BASE_URL%shaders/ascii.frag.glsl" download="ascii.frag.glsl" aria-label="Download the WebGL 2 ASCII fragment shader">[↓ GLSL]</a>
      </div>
      <a class="button github" href="https://github.com/soranonvalid/asciix" target="_blank" rel="noopener" aria-label="asciix on GitHub">
        <svg class="icon" aria-hidden="true"><use href="#icon-github"/></svg>
      </a>
    </div>
    <div class="source-dim">
      <span>SOURCE_DIM</span>
      <strong id="dimensions">—</strong>
    </div>
    <div class="masthead-actions">
      <input id="file" type="file" accept="image/*" hidden>
      <button id="open" class="button" type="button" disabled>
        <svg class="icon" aria-hidden="true"><use href="#icon-open"/></svg> Open image
      </button>
      <button id="export" class="button export" type="button" disabled>
        Export <svg class="icon" aria-hidden="true"><use href="#icon-export"/></svg>
      </button>
    </div>
  </header>

  <main class="studio">
    <section class="workspace" aria-label="Image workspace">
      <section class="preview panel" aria-label="Image preview">
        <div class="preview-head">
          <div id="view-tabs" class="view-tabs" role="tablist" aria-label="Image view">
            <button id="view-preview" type="button" role="tab" aria-controls="preview-panel" aria-selected="true">
              <svg class="icon" aria-hidden="true"><use href="#icon-terminal"/></svg> [01 // Preview]
            </button>
            <button id="view-source" type="button" role="tab" aria-controls="source-panel" aria-selected="false" tabindex="-1">
              <svg class="icon" aria-hidden="true"><use href="#icon-image"/></svg> [02 // Source]
            </button>
          </div>
          <div class="preview-actions">
            <span id="current-style" class="look-badge">Mixed ASCII</span>
            <button id="copy" class="button copy" type="button" aria-label="Copy artwork as PNG" title="Copy artwork as PNG" disabled>
              <svg class="icon" aria-hidden="true"><use href="#icon-copy"/></svg> Copy
            </button>
          </div>
        </div>
        <div class="view-area">
          <span id="edge-tag" class="stage-tag edge-tag">EDGE // 60%</span>
          <div id="artwork" class="artwork">
            <div id="preview-panel" role="tabpanel" aria-labelledby="view-preview" class="artwork-panel" tabindex="0">
              <canvas id="result" width="576" height="656" aria-label="Image rendered with the ASCII shader"></canvas>
            </div>
            <figure id="source-panel" role="tabpanel" aria-labelledby="view-source" class="artwork-panel checkerboard" tabindex="0" hidden>
              <canvas id="source" width="576" height="656" aria-label="Source image"></canvas>
              <figcaption id="source-credit" class="source-credit">
                <a href="https://www.nasa.gov/humans-in-space/astronauts/former-astronauts/#:~:text=Ride%2C%20Sally%20K." target="_blank" rel="noopener">Sally Ride portrait courtesy of NASA</a>
              </figcaption>
            </figure>
          </div>
          <span id="grid-tag" class="stage-tag grid-tag">76 COL // GLYPH</span>
        </div>
        <div class="preview-meta">
          <div class="tone-line">Tone ramp <span id="tone-ramp"></span></div>
          <p id="status" role="status">Starting WebGPU…</p>
        </div>
      </section>

      <div class="readouts">
        <section class="readout panel" aria-labelledby="glyph-heading">
          <div class="readout-head">
            <h2 id="glyph-heading">[03 // Glyph_map]</h2>
            <span id="glyph-steps">—</span>
          </div>
          <div id="glyph-map" class="glyph-map" aria-label="Glyph ramp"></div>
        </section>
        <section class="readout panel" aria-labelledby="specimen-heading">
          <div class="readout-head">
            <h2 id="specimen-heading">[04 // Specimen_params]</h2>
          </div>
          <dl class="specimen">
            <div><dt>Density</dt><dd id="density-readout">53%</dd></div>
            <div><dt>Contour</dt><dd id="contour-readout">60%</dd></div>
            <div><dt>Dither</dt><dd id="dither-readout">0%</dd></div>
          </dl>
        </section>
        <section class="readout panel" aria-labelledby="export-heading">
          <div class="readout-head">
            <h2 id="export-heading">[05 // Export_pipe]</h2>
          </div>
          <div class="export-details">
            <dl>
              <dt>Print finish</dt>
              <dd><span id="finish-readout">25%</span> // <span id="export-state">Starting</span></dd>
            </dl>
            <div class="export-options">
              <select id="export-format" aria-label="Export format" disabled>
                <option value="png">PNG</option>
                <option value="webp">WebP</option>
                <option value="jpeg">JPEG</option>
              </select>
              <select id="export-scale" aria-label="Export scale" disabled>
                <option value="0.5">0.5X</option>
                <option value="1">1X</option>
                <option value="2" selected>2X</option>
                <option value="3">3X</option>
                <option value="4">4X</option>
              </select>
            </div>
          </div>
        </section>
      </div>
    </section>

    <aside class="controls" aria-label="Shader controls">
      <section class="panel" aria-labelledby="input-heading">
        <header class="panel-heading">
          <h2 id="input-heading">[01 // Input &amp; Look]</h2>
        </header>
        <div class="input-controls">
          <div class="field choice">
            <label for="sample">Sample image</label>
            <select id="sample" disabled>
              <option value="portrait">Portrait — Sally Ride (NASA)</option>
              <option value="icon">Transparent icon</option>
              <option value="ramp">Grayscale ramp</option>
              <option value="custom" hidden>Your image</option>
            </select>
          </div>
          <div id="look"></div>
          <div id="quick" class="quick"></div>
        </div>
      </section>

      <section class="parameters panel" aria-labelledby="parameters-heading">
        <header class="panel-heading">
          <h2 id="parameters-heading">[02 // Params matrix]</h2>
          <span>6 modules</span>
        </header>
        <div id="group-menu" class="section-nav" role="tablist" aria-label="Control groups">
          <button id="group-characters" type="button" role="tab" aria-controls="characters" aria-selected="false" tabindex="-1">Characters</button>
          <button id="group-grid-marks" type="button" role="tab" aria-controls="grid-marks" aria-selected="false" tabindex="-1">Grid &amp; marks</button>
          <button id="group-image-treatment" type="button" role="tab" aria-controls="image-treatment" aria-selected="true">Image</button>
          <button id="group-color-controls" type="button" role="tab" aria-controls="color-controls" aria-selected="false" tabindex="-1">Color &amp; alpha</button>
          <button id="group-print-finish" type="button" role="tab" aria-controls="print-finish" aria-selected="false" tabindex="-1">Print finish</button>
          <button id="group-label-controls" type="button" role="tab" aria-controls="label-controls" aria-selected="false" tabindex="-1">Label</button>
        </div>
        <div id="parameter-body" class="parameter-body">
          <section id="characters" class="group-body" role="tabpanel" aria-labelledby="group-characters" hidden></section>
          <section id="grid-marks" class="group-body" role="tabpanel" aria-labelledby="group-grid-marks" hidden></section>
          <section id="image-treatment" class="group-body" role="tabpanel" aria-labelledby="group-image-treatment"></section>
          <section id="color-controls" class="group-body" role="tabpanel" aria-labelledby="group-color-controls" hidden></section>
          <section id="print-finish" class="group-body" role="tabpanel" aria-labelledby="group-print-finish" hidden></section>
          <section id="label-controls" class="group-body" role="tabpanel" aria-labelledby="group-label-controls" hidden></section>
        </div>
        <footer class="parameter-footer">
          <button id="reset" class="quiet" type="button" disabled>
            <svg class="icon" aria-hidden="true"><use href="#icon-reset"/></svg> Reset settings
          </button>
          <span id="render-time" title="Last preview submission time on the CPU">—</span>
        </footer>
      </section>
    </aside>
  </main>
  <script type="module" src="/src/studio.js"></script>
</body>
</html>
